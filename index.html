<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Logistics - Nuova pratica</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 28px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-top: 16px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #333;
    }

    #risultato {
        margin-top: 25px;
        padding: 18px;
        background: #f1f3f5;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Nuova pratica</h1>

    <div class="subtitle">
        Inserisci i dati della spedizione. L'AI analizzerà la pratica e segnalerà eventuali problemi.
    </div>

    <label>Data</label>
    <input type="text" id="data" value="10/09/2026">
        <label>Data e ora ritiro</label>
<input type="datetime-local" id="data_ora_ritiro">

    <label>Tipo merce</label>
    <input type="text" id="tipo_merce" value="Materiale generico">

    <label>Colli</label>
    <input type="number" id="colli" value="3">
        
<label>Peso totale (kg)</label>
<input type="number" id="peso_totale" step="0.1" min="0">

   <label>Volume totale (m³)</label>
<input type="number" id="volume_totale" step="0.01" min="0">

   <label>Note operative</label>
<textarea id="note_operative" rows="4" placeholder="Inserisci eventuali istruzioni o note per il trasporto"></textarea>
   
    <label>Cliente</label>
    <input type="text" id="cliente" value="Cliente Test">

    <label>Vettore</label>
    <input type="text" id="vettore" value="Vettore Test">

    <label>Partenza</label>
<input type="text" id="partenza" value="Milano">

<label>Indirizzo di ritiro</label>
<input type="text" id="indirizzo_ritiro" value="Via Roma 10, Milano">

<label>Destinazione</label>
<input type="text" id="destinazione" value="Bergamo">
    <label>Data e ora consegna</label>
<input type="datetime-local" id="data_ora_consegna">

<label>Indirizzo di consegna</label>
<input type="text" id="indirizzo_consegna" value="Via Milano 20, Bergamo">

    <button onclick="analizzaPratica()">
        ANALIZZA PRATICA
    </button>

    <div id="stato"></div>

<div id="risultato">
    Il risultato dell'analisi AI comparirà qui.
</div>

</div>

<script>

async function analizzaPratica() {

    const risultato = document.getElementById("risultato");

    risultato.innerText = "Analisi AI in corso...";

    const dati = {
    data: document.getElementById("data").value,
    data_ora_ritiro: document.getElementById("data_ora_ritiro").value,
    tipo_merce: document.getElementById("tipo_merce").value,
    colli: document.getElementById("colli").value,
    peso_totale: document.getElementById("peso_totale").value,
    volume_totale: document.getElementById("volume_totale").value,
    note_operative: document.getElementById("note_operative").value,
    cliente: document.getElementById("cliente").value,
    vettore: document.getElementById("vettore").value,
    partenza: document.getElementById("partenza").value,
    indirizzo_ritiro: document.getElementById("indirizzo_ritiro").value,
    destinazione: document.getElementById("destinazione").value,
    data_ora_consegna: document.getElementById("data_ora_consegna").value,
    indirizzo_consegna: document.getElementById("indirizzo_consegna").value
};

    try {

        const response = await fetch("https://hook.eu1.make.com/xjtdfh4rxi21154ru2hyx9s2wr9ktuit", {
            method: "POST",
            body: new URLSearchParams(dati)
        });

        if (!response.ok) {
            throw new Error("Errore HTTP: " + response.status);
        }
const risposta = await response.text();

const righe = risposta.split("\n");
const idPratica = righe[0] || "";
const analisi = righe.slice(1).join("\n");

risultato.innerText = idPratica + "\n\n" + analisi;
   

const stato = document.getElementById("stato");

if (risposta.includes("STATO: REGOLARE")) {
    stato.innerText = "🟢 REGOLARE";
    stato.style.color = "green";
}

else if (risposta.includes("STATO: ATTENZIONE")) {
    stato.innerText = "🟠 ATTENZIONE";
    stato.style.color = "orange";
}

else if (risposta.includes("STATO: PROBLEMA")) {
    stato.innerText = "🔴 PROBLEMA";
    stato.style.color = "red";
}

else {
    stato.innerText = "";
}
    } catch (errore) {

        console.error(errore);

        risultato.innerText =
            "Errore nel collegamento con l'AI.\n\n" +
            "Controlla il webhook Make e la configurazione dello scenario.";

    }
}

</script>

</body>
</html>

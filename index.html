<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuova pratica - AI Logistics</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 40px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    font-weight: bold;
    font-size: 14px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: #111827;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#risultato {
    margin-top: 25px;
    padding: 20px;
    background: #f0fdf4;
    border-radius: 8px;
    white-space: pre-wrap;
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Nuova pratica</h1>

<p>L'AI analizzerà la spedizione e segnalerà eventuali problemi prima della conferma.</p>

<div class="grid">

<div>
<label>Data</label>
<input id="data" value="10/09/2026">
</div>

<div>
<label>Tipo merce</label>
<input id="tipo_merce" value="Materiale generico">
</div>

<div>
<label>Colli</label>
<input id="colli" value="3">
</div>

<div>
<label>Cliente</label>
<input id="cliente" value="Cliente Test">
</div>

<div>
<label>Vettore</label>
<input id="vettore" value="Vettore Test">
</div>

<div>
<label>Partenza</label>
<input id="partenza" value="Milano">
</div>

<div>
<label>Destinazione</label>
<input id="destinazione" value="Bergamo">
</div>

</div>

<button onclick="analizza()">ANALIZZA PRATICA</button>

<div id="risultato"></div>

</div>

<script>

async function analizza() {

    const risultato = document.getElementById("risultato");

    risultato.style.display = "block";
    risultato.innerText = "Analisi AI in corso...";

    const dati = {
        data: document.getElementById("data").value,
        tipo_merce: document.getElementById("tipo_merce").value,
        colli: document.getElementById("colli").value,
        cliente: document.getElementById("cliente").value,
        vettore: document.getElementById("vettore").value,
        partenza: document.getElementById("partenza").value,
        destinazione: document.getElementById("destinazione").value
    };

    try {

        const response = await fetch("https://hook.eu1.make.com/xjtdfh4rxi21154ru2hyx9s2wr9ktuit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dati)
        });

        const risposta = await response.json();

        risultato.innerText = risposta.risultato || "Nessun risultato ricevuto.";

    } catch (errore) {

        risultato.innerText = "Errore nel collegamento con l'AI.";

    }
}

</script>

</body>
</html>

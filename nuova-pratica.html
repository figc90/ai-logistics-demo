<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuova pratica | MatRi-mIA Logistics</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#172033;
  min-height:100vh;
}

a{
  text-decoration:none;
}

input,
textarea,
select,
button{
  font:inherit;
}

.top-header{
  background:#fff;
  border-bottom:1px solid #e5eaf0;
  position:sticky;
  top:0;
  z-index:50;
}

.top-header-inner{
  max-width:1280px;
  margin:auto;
  padding:8px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  width:175px;
  height:auto;
  display:block;
}

.header-actions{
  display:flex;
  gap:10px;
}

.btn{
  min-height:42px;
  padding:0 16px;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
  border:none;
  cursor:pointer;
}

.btn-secondary{
  background:#eef3f8;
  color:#173459;
}

.page{
  max-width:1280px;
  margin:auto;
  padding:30px 22px 60px;
}

.back{
  display:inline-block;
  color:#2ca9d2;
  font-size:14px;
  font-weight:800;
  margin-bottom:22px;
}

.heading{
  margin-bottom:26px;
}

.eyebrow{
  color:#2ca9d2;
  font-size:12px;
  font-weight:900;
  letter-spacing:2.2px;
  margin-bottom:8px;
}

h1{
  color:#10284a;
  font-size:46px;
  line-height:1;
  margin-bottom:10px;
}

.subtitle{
  color:#758399;
  font-size:16px;
  line-height:1.5;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(300px,1fr);
  gap:20px;
  align-items:start;
}

.card{
  background:#fff;
  border:1px solid #e1e7ee;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(19,40,74,.06);
}

.card + .card{
  margin-top:20px;
}

.card-header{
  padding:20px 22px;
  border-bottom:1px solid #edf0f4;
}

.card-header h2{
  color:#173459;
  font-size:20px;
}

.card-header p{
  margin-top:5px;
  color:#8795a8;
  font-size:13px;
}

.card-body{
  padding:22px;
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.wide{
  grid-column:1 / -1;
}

label{
  color:#65758b;
  font-size:12px;
  font-weight:900;
  letter-spacing:.4px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dce3eb;
  background:#f9fbfd;
  color:#24384f;
  border-radius:11px;
  padding:12px 13px;
  outline:none;
  transition:.2s ease;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#4ec5e6;
  box-shadow:0 0 0 3px rgba(78,197,230,.10);
  background:#fff;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.helper{
  color:#98a3b2;
  font-size:11px;
  line-height:1.4;
}

.ai-card{
  position:sticky;
  top:78px;
}

.ai-header{
  background:linear-gradient(135deg,#0b1d3a,#123b67);
  padding:20px 22px;
  color:white;
}

.ai-label{
  color:#55c9e9;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:6px;
}

.ai-header h2{
  font-size:21px;
}

.ai-content{
  padding:22px;
}

.ai-state{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.ai-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#55c9e9;
  box-shadow:0 0 12px rgba(85,201,233,.7);
}

.ai-state strong{
  color:#173459;
  font-size:15px;
}

.ai-text{
  color:#5b6a80;
  font-size:14px;
  line-height:1.65;
}

.ai-checklist{
  margin-top:22px;
  display:grid;
  gap:12px;
}

.ai-check{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.ai-check-icon{
  width:24px;
  height:24px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf8fc;
  color:#2ca9d2;
  font-weight:900;
  flex:0 0 auto;
}

.ai-check span{
  color:#58667a;
  font-size:13px;
  line-height:1.5;
}

.ai-result{
  display:none;
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid #edf0f4;
}

.ai-result-title{
  color:#8795a8;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.2px;
  margin-bottom:8px;
}

.ai-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  margin-bottom:18px;
}

.ai-status-ok{
  background:#e8f7ef;
  color:#23784f;
}

.ai-status-warning{
  background:#fff2d6;
  color:#a76600;
}

.ai-status-error{
  background:#ffe7e3;
  color:#b42318;
}

.ai-status-default{
  background:#edf1f5;
  color:#596778;
}

.ai-section{
  margin-bottom:18px;
}

.ai-section h3{
  color:#2ca9d2;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.1px;
  margin-bottom:6px;
}

.ai-section p{
  color:#4d5c72;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.actions-bar{
  margin-top:22px;
  display:flex;
  justify-content:flex-end;
  gap:12px;
  flex-wrap:wrap;
}

.actions-bar .btn{
  min-height:50px;
  padding:0 22px;
}

.analyze-btn{
  background:linear-gradient(135deg,#ec4f32,#ff7b1f);
  color:#fff;
}

.analyze-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.cancel-btn{
  background:#edf2f7;
  color:#173459;
}

.message{
  display:none;
  margin-top:18px;
  padding:14px 16px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
}

.message-success{
  display:block;
  background:#ecf9f2;
  border:1px solid #ccebd9;
  color:#1d704c;
}

<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imposta password | MatRi-mIA Logistics</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(41,169,210,.15),transparent 35%),
    linear-gradient(135deg,#06182f,#0d2d50);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  color:#172033;
}

.auth-card{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(0,0,0,.28);
}

.logo-area{
  padding:28px 30px 22px;
  display:flex;
  justify-content:center;
  background:linear-gradient(145deg,#fff,#f5f8fb);
  border-bottom:1px solid #e8edf2;
}

.logo-area img{
  width:230px;
  max-width:85%;
  display:block;
}

.card-body{
  padding:34px;
}

.eyebrow{
  color:#2ca9d2;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:9px;
}

h1{
  color:#10284a;
  font-size:28px;
  margin-bottom:9px;
}

.subtitle{
  color:#7d8ba0;
  font-size:13px;
  line-height:1.6;
  margin-bottom:28px;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  color:#526177;
  font-size:10px;
  font-weight:900;
  letter-spacing:.5px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:48px;
  border:1px solid #dce3eb;
  border-radius:11px;
  padding:0 14px;
  outline:none;
  color:#30465f;
  font-size:14px;
  transition:.18s ease;
}

input:focus{
  border-color:#29a9d2;
  box-shadow:0 0 0 3px rgba(41,169,210,.10);
}

.helper{
  margin-top:7px;
  color:#98a4b4;
  font-size:9px;
  line-height:1.5;
}

.primary-btn{
  width:100%;
  min-height:48px;
  border:none;
  border-radius:11px;
  background:linear-gradient(135deg,#ec4f32,#ff7b1f);
  color:#fff;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  margin-top:5px;
  box-shadow:0 8px 20px rgba(236,79,50,.20);
}

.primary-btn:hover{
  transform:translateY(-1px);
}

.primary-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px 14px;
  border-radius:10px;
  font-size:11px;
  font-weight:700;
  line-height:1.5;
}

.message.error{
  display:block;
  background:#fff1f0;
  border:1px solid #ffd4d1;
  color:#b42318;
}

.message.success{
  display:block;
  background:#e5f7ee;
  border:1px solid #c9ebda;
  color:#23784f;
}

.message.info{
  display:block;
  background:#e8f4fb;
  border:1px solid #cde7f4;
  color:#167fa5;
}

.back-login{
  margin-top:20px;
  text-align:center;
  font-size:11px;
  color:#8391a4;
}

.back-login a{
  color:#168fb8;
  font-weight:900;
  text-decoration:none;
}

@media(max-width:520px){

  body{
    padding:14px;
  }

  .card-body{
    padding:27px 22px;
  }

  h1{
    font-size:25px;
  }

}

</style>
</head>

<body>

<div class="auth-card">

  <div class="logo-area">
    <img
      src="matrimia-logo-web.png"
      alt="MatRi-mIA Logistics">
  </div>

  <div class="card-body">

    <div class="eyebrow">
      MATRI-MIA LOGISTICS
    </div>

    <h1>
      Imposta la password
    </h1>

    <div class="subtitle">
      Scegli una password per accedere al tuo account MatRi-mIA Logistics.
    </div>

    <form id="passwordForm">

      <div class="form-group">

        <label for="password">
          NUOVA PASSWORD
        </label>

        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required>

        <div class="helper">
          Usa almeno 8 caratteri.
        </div>

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          CONFERMA PASSWORD
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required>

      </div>

      <button
        id="saveButton"
        class="primary-btn"
        type="submit">
        Imposta password
      </button>

    </form>

    <div
      id="messageBox"
      class="message">
    </div>

    <div class="back-login">
      Hai già impostato la password?
      <a href="login.html">
        Accedi
      </a>
    </div>

  </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://sctzockiurjsxzdkctmy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hAZ4e_wz4f9R7wc4YdkbmQ_7HozQD9G";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const passwordForm =
document.getElementById(
  "passwordForm"
);

const passwordInput =
document.getElementById(
  "password"
);

const confirmPasswordInput =
document.getElementById(
  "confirmPassword"
);

const saveButton =
document.getElementById(
  "saveButton"
);

const messageBox =
document.getElementById(
  "messageBox"
);


/* =========================================================
   MESSAGGI
========================================================= */

function showMessage(
  text,
  type = "info"
){

  messageBox.textContent =
  text;

  messageBox.className =
  "message " + type;

}

function hideMessage(){

  messageBox.textContent =
  "";

  messageBox.className =
  "message";

}


/* =========================================================
   GESTIONE SESSIONE INVITO / RECOVERY
========================================================= */

async function initializeSession(){

  hideMessage();

  /*
   * Supabase può arrivare qui tramite:
   *
   * 1. PKCE:
   *    ?code=...
   *
   * 2. sessione già creata dal link
   *    di recovery/invito.
   */

  const params =
  new URLSearchParams(
    window.location.search
  );

  const code =
  params.get("code");

  if(code){

    const {
      error
    } =
    await supabase.auth
    .exchangeCodeForSession(
      code
    );

    if(error){

      console.error(
        "Errore exchange code:",
        error
      );

      /*
       * Prima di considerare il link
       * non valido controlliamo se
       * esiste già una sessione.
       */

      const {
        data:{
          session
        }
      } =
      await supabase.auth
      .getSession();

      if(!session?.user){

        showMessage(
          "Il link non è valido oppure è scaduto. Richiedi un nuovo invito.",
          "error"
        );

        saveButton.disabled =
        true;

        return false;
      }

    }

  }

  const {
    data:{
      session
    },
    error
  } =
  await supabase.auth
  .getSession();

  if(
    error ||
    !session?.user
  ){

    console.error(
      "Sessione non disponibile:",
      error
    );

    showMessage(
      "Sessione non disponibile. Apri nuovamente il link ricevuto via email.",
      "error"
    );

    saveButton.disabled =
    true;

    return false;
  }

  return true;

}


/* =========================================================
   DESTINAZIONE IN BASE AL RUOLO
========================================================= */

async function redirectByRole(){

  /*
   * Recuperiamo nuovamente l'utente
   * autenticato dopo l'aggiornamento
   * della password.
   */

  const {
    data:{
      user
    },
    error:userError
  } =
  await supabase.auth
  .getUser();

  if(
    userError ||
    !user
  ){

    console.error(
      "Errore recupero utente:",
      userError
    );

    /*
     * In caso di problema non lasciamo
     * l'utente bloccato.
     */
    window.location.replace(
      "login.html"
    );

    return;
  }

  const {
    data:profile,
    error:profileError
  } =
  await supabase
  .from("profiles")
  .select(
    "id,ruolo,azienda_id"
  )
  .eq(
    "id",
    user.id
  )
  .maybeSingle();

  if(profileError){

    console.error(
      "Errore recupero profilo:",
      profileError
    );

    window.location.replace(
      "login.html"
    );

    return;
  }

  /*
   * L'autista non deve transitare
   * dalla dashboard amministrativa.
   */

  if(
    String(
      profile?.ruolo ||
      ""
    )
    .trim()
    .toLowerCase() ===
    "autista"
  ){

    window.location.replace(
      "autista.html"
    );

    return;
  }

  /*
   * Azienda / admin / superadmin
   */

  window.location.replace(
    "dashboard.html"
  );

}


/* =========================================================
   SALVATAGGIO PASSWORD
========================================================= */

passwordForm.addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    hideMessage();

    const password =
    passwordInput.value;

    const confirmation =
    confirmPasswordInput.value;

    if(
      password.length < 8
    ){

      showMessage(
        "La password deve contenere almeno 8 caratteri.",
        "error"
      );

      return;
    }

    if(
      password !==
      confirmation
    ){

      showMessage(
        "Le due password non coincidono.",
        "error"
      );

      return;
    }

    saveButton.disabled =
    true;

    saveButton.textContent =
    "Salvataggio...";

    const {
      error
    } =
    await supabase.auth
    .updateUser({
      password
    });

    if(error){

      console.error(
        "Errore aggiornamento password:",
        error
      );

      showMessage(
        error.message ||
        "Impossibile impostare la password.",
        "error"
      );

      saveButton.disabled =
      false;

      saveButton.textContent =
      "Imposta password";

      return;
    }

    showMessage(
      "Password impostata correttamente. Accesso in corso...",
      "success"
    );

    /*
     * Ora decidiamo la pagina corretta
     * in base al ruolo dell'utente.
     */

    setTimeout(
      async ()=>{

        await redirectByRole();

      },
      700
    );

  }
);


/* =========================================================
   START
========================================================= */

const sessionReady =
await initializeSession();

if(sessionReady){

  passwordInput.focus();

}

</script>

</body>
</html>

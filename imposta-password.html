<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imposta password | MatRi-mIA Logistics</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(
      circle at top right,
      rgba(44,169,210,.13),
      transparent 34%
    ),
    linear-gradient(
      135deg,
      #f3f6fa,
      #edf3f8
    );
  color:#172033;
  min-height:100vh;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 18px;
}

.card{
  width:100%;
  max-width:470px;
  background:#fff;
  border:1px solid #dfe6ee;
  border-radius:20px;
  box-shadow:
    0 20px 55px
    rgba(19,40,74,.11);
  overflow:hidden;
}

.logo-area{
  padding:26px 30px 20px;
  display:flex;
  justify-content:center;
}

.logo-box{
  width:210px;
  min-height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      145deg,
      #fff,
      #f4f8fc
    );
  border:1px solid #e4e9ef;
  border-radius:15px;
  box-shadow:
    0 8px 24px
    rgba(19,40,74,.08);
}

.logo-box img{
  width:180px;
  max-width:88%;
  display:block;
}

.content{
  padding:10px 34px 34px;
}

.eyebrow{
  text-align:center;
  color:#2ca9d2;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:9px;
}

h1{
  color:#10284a;
  font-size:28px;
  text-align:center;
  margin-bottom:9px;
}

.subtitle{
  color:#8492a6;
  font-size:12px;
  line-height:1.6;
  text-align:center;
  margin-bottom:25px;
}

.message{
  padding:13px 14px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:12px;
  font-weight:700;
  line-height:1.5;
}

.message-error{
  background:#fff1f0;
  border:1px solid #ffd4d1;
  color:#b42318;
}

.message-success{
  background:#eaf8f1;
  border:1px solid #c8ead8;
  color:#23784f;
}

.message-info{
  background:#eef7fb;
  border:1px solid #cfe8f2;
  color:#28667e;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  color:#53647a;
  font-size:11px;
  font-weight:900;
  margin-bottom:7px;
}

.password-wrap{
  position:relative;
}

input{
  width:100%;
  height:48px;
  border:1px solid #dce3eb;
  border-radius:10px;
  padding:0 48px 0 13px;
  outline:none;
  color:#30465f;
  background:#fff;
  font-size:13px;
}

input:focus{
  border-color:#2ca9d2;
  box-shadow:
    0 0 0 3px
    rgba(44,169,210,.10);
}

input:disabled{
  background:#f6f8fa;
  cursor:not-allowed;
}

.toggle-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border:none;
  background:transparent;
  color:#7c8ca0;
  cursor:pointer;
  font-size:16px;
}

.help{
  color:#9aa6b6;
  font-size:10px;
  line-height:1.5;
  margin-top:6px;
}

.submit-btn{
  width:100%;
  height:48px;
  border:none;
  border-radius:11px;
  background:
    linear-gradient(
      135deg,
      #ec4f32,
      #ff7b1f
    );
  color:#fff;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 8px 20px
    rgba(236,79,50,.20);
  margin-top:5px;
}

.submit-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.spinner{
  display:inline-block;
  width:13px;
  height:13px;
  border:
    2px solid
    rgba(255,255,255,.45);
  border-top-color:#fff;
  border-radius:50%;
  margin-right:8px;
  vertical-align:-2px;
  animation:
    spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.footer{
  border-top:1px solid #edf0f4;
  padding:17px 25px;
  text-align:center;
  color:#9aa6b6;
  font-size:9px;
}

@media(max-width:520px){

  .content{
    padding:8px 22px 28px;
  }

  .logo-area{
    padding-top:20px;
  }

  h1{
    font-size:25px;
  }

}

</style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="logo-area">

      <div class="logo-box">

        <img
          src="matrimia-logo-web.png"
          alt="MatRi-mIA Logistics"
        >

      </div>

    </div>

    <div class="content">

      <div class="eyebrow">
        MATRI-MIA LOGISTICS
      </div>

      <h1>
        Imposta la password
      </h1>

      <div class="subtitle">
        Scegli la password che utilizzerai
        per accedere al tuo account
        MatRi-mIA Logistics.
      </div>

      <div
        id="messageBox"
        style="display:none">
      </div>

      <form id="passwordForm">

        <div class="form-group">

          <label for="password">
            Nuova password
          </label>

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Inserisci la nuova password"
              required
              disabled
            >

            <button
              class="toggle-password"
              type="button"
              data-target="password">
              ◉
            </button>

          </div>

          <div class="help">
            Utilizza almeno 8 caratteri.
          </div>

        </div>

        <div class="form-group">

          <label for="confirmPassword">
            Conferma password
          </label>

          <div class="password-wrap">

            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Ripeti la nuova password"
              required
              disabled
            >

            <button
              class="toggle-password"
              type="button"
              data-target="confirmPassword">
              ◉
            </button>

          </div>

        </div>

        <button
          id="submitButton"
          class="submit-btn"
          type="submit"
          disabled>
          Verifica invito...
        </button>

      </form>

    </div>

    <div class="footer">
      MatRi-mIA Logistics · Accesso sicuro
    </div>

  </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================
   CONFIGURAZIONE SUPABASE
========================================= */

const SUPABASE_URL =
"https://sctzockiurjsxzdkctmy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hAZ4e_wz4f9R7wc4YdkbmQ_7HozQD9G";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   ELEMENTI PAGINA
========================================= */

const form =
document.getElementById(
  "passwordForm"
);

const passwordInput =
document.getElementById(
  "password"
);

const confirmPasswordInput =
document.getElementById(
  "confirmPassword"
);

const submitButton =
document.getElementById(
  "submitButton"
);

const messageBox =
document.getElementById(
  "messageBox"
);


/* =========================================
   MESSAGGI
========================================= */

function hideMessage(){

  messageBox.style.display =
  "none";

  messageBox.textContent =
  "";

}


function showError(text){

  messageBox.textContent =
  text;

  messageBox.className =
  "message message-error";

  messageBox.style.display =
  "block";

}


function showSuccess(text){

  messageBox.textContent =
  text;

  messageBox.className =
  "message message-success";

  messageBox.style.display =
  "block";

}


function showInfo(text){

  messageBox.textContent =
  text;

  messageBox.className =
  "message message-info";

  messageBox.style.display =
  "block";

}


/* =========================================
   ABILITA / DISABILITA FORM
========================================= */

function enableForm(){

  passwordInput.disabled =
  false;

  confirmPasswordInput.disabled =
  false;

  submitButton.disabled =
  false;

  submitButton.textContent =
  "Imposta password";

}


function disableForm(){

  passwordInput.disabled =
  true;

  confirmPasswordInput.disabled =
  true;

  submitButton.disabled =
  true;

}


/* =========================================
   MOSTRA / NASCONDI PASSWORD
========================================= */

document
.querySelectorAll(
  ".toggle-password"
)
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      const targetId =
      button.dataset.target;

      const input =
      document.getElementById(
        targetId
      );

      if(
        !input ||
        input.disabled
      ){
        return;
      }

      if(
        input.type ===
        "password"
      ){

        input.type =
        "text";

        button.textContent =
        "◌";

      }
      else{

        input.type =
        "password";

        button.textContent =
        "◉";

      }

    }
  );

});


/* =========================================
   CONTROLLO INVITO / SESSIONE
========================================= */

async function prepareSession(){

  disableForm();

  submitButton.textContent =
  "Verifica invito...";

  try{

    /*
     * 1. Controlliamo se Supabase ci ha
     *    riportato sulla pagina con un
     *    authorization code PKCE.
     */

    const url =
    new URL(
      window.location.href
    );

    const code =
    url.searchParams.get(
      "code"
    );


    if(code){

      const {
        error:
        exchangeError
      } =
      await supabase
        .auth
        .exchangeCodeForSession(
          code
        );


      if(exchangeError){

        console.error(
          "Errore exchangeCodeForSession:",
          exchangeError
        );

        showError(
          "Il link di invito non è valido oppure è scaduto. Richiedi un nuovo invito."
        );

        return false;

      }


      /*
       * Togliamo il code dall'URL
       * dopo averlo utilizzato.
       */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

    }


    /*
     * 2. Controlliamo se adesso esiste
     *    una sessione Supabase valida.
     */

    let {
      data:{
        session
      },
      error:
      sessionError
    } =
    await supabase
      .auth
      .getSession();


    if(sessionError){

      console.error(
        "Errore getSession:",
        sessionError
      );

    }


    /*
     * Alcuni redirect possono richiedere
     * un breve istante prima che la
     * sessione sia disponibile.
     */

    if(!session){

      await new Promise(
        resolve =>
        setTimeout(
          resolve,
          700
        )
      );


      const secondCheck =
      await supabase
        .auth
        .getSession();


      session =
      secondCheck
        .data
        .session;

    }


    /*
     * 3. Se ancora non esiste una
     *    sessione, il link non è
     *    utilizzabile.
     */

    if(!session){

      showError(
        "Il link di invito non è valido, è scaduto oppure è già stato utilizzato. Richiedi un nuovo invito."
      );

      return false;

    }


    /*
     * 4. Verifichiamo anche che esista
     *    effettivamente l'utente.
     */

    const {
      data:{
        user
      },
      error:
      userError
    } =
    await supabase
      .auth
      .getUser();


    if(
      userError ||
      !user
    ){

      console.error(
        "Errore recupero utente:",
        userError
      );

      showError(
        "Non è stato possibile verificare l'account associato all'invito."
      );

      return false;

    }


    /*
     * Sessione valida.
     */

    hideMessage();

    enableForm();

    return true;

  }
  catch(error){

    console.error(
      "Errore preparazione sessione:",
      error
    );

    showError(
      "Si è verificato un errore durante la verifica dell'invito."
    );

    return false;

  }

}


/* =========================================
   SALVATAGGIO PASSWORD
========================================= */

form.addEventListener(
  "submit",
  async event=>{

    event.preventDefault();

    hideMessage();


    const password =
    passwordInput.value;

    const confirmPassword =
    confirmPasswordInput.value;


    /* =====================================
       VALIDAZIONE PASSWORD
    ===================================== */

    if(
      password.length < 8
    ){

      showError(
        "La password deve contenere almeno 8 caratteri."
      );

      return;

    }


    if(
      password !==
      confirmPassword
    ){

      showError(
        "Le due password non coincidono."
      );

      return;

    }


    submitButton.disabled =
    true;

    passwordInput.disabled =
    true;

    confirmPasswordInput.disabled =
    true;


    submitButton.innerHTML =
    '<span class="spinner"></span>Salvataggio...';


    try{

      /*
       * Ricontrolliamo la sessione
       * immediatamente prima
       * dell'aggiornamento.
       */

      const {
        data:{
          session
        },
        error:
        sessionError
      } =
      await supabase
        .auth
        .getSession();


      if(
        sessionError ||
        !session
      ){

        showError(
          "La sessione è scaduta. Richiedi un nuovo invito."
        );

        return;

      }


      /*
       * Impostazione nuova password.
       */

      const {
        error:
        updateError
      } =
      await supabase
        .auth
        .updateUser({
          password:
          password
        });


      if(updateError){

        console.error(
          "Errore aggiornamento password:",
          updateError
        );

        showError(
          updateError.message ||
          "Impossibile impostare la password."
        );

        return;

      }


      /*
       * Password impostata.
       */

      showSuccess(
        "Password impostata correttamente. Accesso a MatRi-mIA in corso..."
      );


      /*
       * Mandiamo l'utente direttamente
       * alla dashboard.
       *
       * La sessione Supabase rimane
       * attiva nel browser.
       */

      setTimeout(
        ()=>{

          window.location.replace(
            "dashboard.html"
          );

        },
        1500
      );

    }
    catch(error){

      console.error(
        "Errore salvataggio password:",
        error
      );

      showError(
        "Si è verificato un errore durante il salvataggio della password."
      );

    }
    finally{

      /*
       * Se siamo ancora sulla pagina
       * significa che non siamo ancora
       * stati reindirizzati.
       */

      if(
        window.location.pathname
          .includes(
            "imposta-password"
          )
      ){

        passwordInput.disabled =
        false;

        confirmPasswordInput.disabled =
        false;

        submitButton.disabled =
        false;

        submitButton.textContent =
        "Imposta password";

      }

    }

  }
);


/* =========================================
   AVVIO
========================================= */

prepareSession();

</script>

</body>
</html>
